#
# This file is overlaid on the base `adf_variable_defaults.yaml` when a config
# sets:
#     diag_basic_info:
#         defaults_overlay_file: <path>/adf_variable_defaults_noresm.yaml
#
# Semantics (see AdfObs in lib/adf_obs.py):
#   - Each top-level entry here REPLACES the whole entry of the same name in the
#     base file (per-variable, not field-by-field).
#   - Variables NOT listed here keep their base definition.
#
# So: list ONLY the variables that differ for NorESM (e.g. the aerosols), and
# give each one a COMPLETE definition (all the fields that variable needs).
#
# Example — NorESM sulfate column burden (replace the placeholder plotting
# fields with the real ones copied from the base entry, then adjust as needed):
#
# cb_SULFATE:
#   category: "Aerosols"
#   colormap: "plasma_r"
#   derivable_from: [so4_a1, so4_a2, so4_a3]
#   derivation_formula: "so4_a1 + so4_a2 + so4_a3"
#   derivable_from_cam_chem: [so4_a1, so4_a2, so4_a3, so4_a5]
#   derivation_formula_cam_chem: "so4_a1 + so4_a2 + so4_a3 + so4_a5"
#   # ... plus the remaining plotting/units fields for this variable
#
# Add the NorESM-specific aerosol variables below:
#
#+++++++++++
# Category: Aerosols
#+++++++++++

#List of zonal areosols
