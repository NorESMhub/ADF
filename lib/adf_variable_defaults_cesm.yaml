# CESM variable-defaults OVERLAY.
#
# This file is overlaid on the base `adf_variable_defaults.yaml` when a config
# sets:
#     diag_basic_info:
#         defaults_overlay_file: <path>/adf_variable_defaults_cesm.yaml
#
# Semantics (see AdfObs in lib/adf_obs.py):
#   - Each top-level entry here REPLACES the whole entry of the same name in the
#     base file (per-variable, not field-by-field).
#   - Variables NOT listed here keep their base definition.
#
# So: list ONLY the variables that differ for Cesm (e.g. the aerosols), and
# give each one a COMPLETE definition (all the fields that variable needs).
#
# Add the CESM-specific aerosol variables below:
#
#+++++++++++
# Category: Aerosols
#+++++++++++

#List of zonal areosols
